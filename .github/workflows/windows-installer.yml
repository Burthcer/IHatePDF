name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/generateTestFixtures.ts
      - run: npm test
      - run: npm run build:exe
        env:
          # Not code-signed: Windows SmartScreen shows "More info → Run anyway" on first install.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: IHatePDF-Setup
          path: FinalApp/IHatePDF-Setup.exe
          if-no-files-found: error
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # main (and v* tags) publish the GitHub Release v<package.json version> with the
      # installer attached; the README's download button links to its asset.
      # Bump "version" in package.json to cut a new release; later pushes of the same
      # version refresh that release's installer. A version with a suffix (1.3.1-beta)
      # becomes a pre-release, never marked latest: published by pushing its v* tag, or
      # by running this workflow by hand (workflow_dispatch) on the branch that has it.
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && contains(steps.ver.outputs.version, '-'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: IHatePDF v${{ steps.ver.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: FinalApp/IHatePDF-Setup.exe
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.ver.outputs.version, '-') }}
