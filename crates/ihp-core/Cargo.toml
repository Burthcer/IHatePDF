[package]
name = "ihp-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
fast_image_resize = "6.1.0"
flate2 = "1.1.11"
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
lopdf = "0.47.0"
pdfium-render = { version = "0.9.5", features = ["thread_safe"] }
png = "0.18.1"
thiserror = "2.0.21"
zip = { version = "9.5.1", default-features = false }
