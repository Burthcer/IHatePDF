[package]
name = "ihp-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
fast_image_resize = "6.1.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["gif", "bmp", "tiff", "webp"] }
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
lopdf = "0.47.0"
pdfium-render = { version = "0.9.5", features = ["thread_safe"] }
png = "0.18.1"
regex = "1.13.1"
resvg = { version = "0.50.0", default-features = false }
roxmltree = "0.21.2"
rustybuzz = "0.20.1"
serde_json = "1.0.154"
subsetter = "0.2.6"
thiserror = "2.0.21"
ttf-parser = "0.25.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
